<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Italian — Admin Dashboard</title>
    <link rel="stylesheet" href="/css/admin.css">
    <style>
.modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0,0,0,0.5);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
}
.modal.hidden { display: none; }
.modal-content {
    background: white;
    padding: 2rem;
    border-radius: 8px;
    max-width: 500px;
    width: 90%;
    position: relative;
}
.close-btn {
    position: absolute;
    top: 1rem;
    right: 1rem;
    font-size: 2rem;
    cursor: pointer;
}
.tab-btn {
    padding: 0.5rem 1rem;
    margin: 0.5rem;
    border: none;
    border-radius: 4px;
    cursor: pointer;
}
.tab-btn.active {
    background-color: #8B4513;
    color: white;
}
.tab-content {
    display: none;
}
.tab-content.active {
    display: block;
}
</style>
</head>
<body>

<nav class="navbar">
    <a href="/" class="navbar-brand">House-Italian (Admin)</a>
    <div class="navbar-links">
        <a href="/">Home</a>
        <a href="/cardapio">Cardápio</a>
        <span id="nav-usuario">
            <span id="nav-nome"></span>
            &nbsp;|&nbsp;
            <a href="#" onclick="logout()">Sair</a>
        </span>
    </div>
</nav>

<div class="admin-dashboard-bg">
    <div class="admin-container">
        <h1>Painel Administrativo</h1>
        
        <div class="admin-tabs">
            <button class="tab-btn active" onclick="mostrarTab('mesas')">Gerenciar Mesas</button>
            <button class="tab-btn" onclick="mostrarTab('reservas')">Gerenciar Reservas</button>
            <button class="tab-btn" onclick="mostrarTab('usuarios')">Gerenciar Usuários</button>
            <button class="tab-btn" onclick="mostrarTab('auditoria')">Logs de Auditoria</button>
        </div>

        <!-- Tab: Mesas -->
        <div id="tab-mesas" class="tab-content active">
            <h2>Mesas</h2>
            <button class="btn-adicionar" onclick="abrirModalMesa()">Adicionar Mesa</button>
            <div id="lista-mesas">
                <p>Carregando mesas...</p>
            </div>
        </div>

        <!-- Tab: Reservas -->
        <div id="tab-reservas" class="tab-content">
            <h2>Reservas</h2>
            <div id="lista-reservas-admin">
                <p>Carregando reservas...</p>
            </div>
        </div>

        <!-- Tab: Usuários -->
        <div id="tab-usuarios" class="tab-content">
            <h2>Usuários</h2>
            <div id="lista-usuarios">
                <p>Carregando usuários...</p>
            </div>
        </div>

        <!-- Tab: Auditoria -->
        <div id="tab-auditoria" class="tab-content">
            <h2>Logs de Auditoria</h2>
            <div id="lista-auditoria">
                <p>Carregando logs...</p>
            </div>
        </div>
    </div>

    <div class="page-footer">
        Rua 7 Setor Comercial - Luziânia, GO &nbsp;·&nbsp; (55) 5555-5555
    </div>
</div>

<!-- Modal para Adicionar/Editar Mesa -->
<div id="modal-mesa" class="modal hidden">
    <div class="modal-content">
        <span class="close-btn" onclick="fecharModalMesa()">&times;</span>
        <h2 id="modal-titulo-mesa">Adicionar Mesa</h2>
        <div class="form-group">
            <label for="modal-mesa-numero">Número</label>
            <input type="number" id="modal-mesa-numero">
        </div>
        <div class="form-group">
            <label for="modal-mesa-capacidade">Capacidade</label>
            <input type="number" id="modal-mesa-capacidade" min="1" max="20">
        </div>
        <div class="form-group">
            <label for="modal-mesa-localizacao">Localização</label>
            <input type="text" id="modal-mesa-localizacao">
        </div>
        <div class="form-group">
            <label for="modal-mesa-descricao">Descrição</label>
            <textarea id="modal-mesa-descricao" rows="3"></textarea>
        </div>
        <button class="btn-salvar" onclick="salvarMesa()">Salvar</button>
    </div>
</div>

<script src="/js/dashboard.js"></script>

</body>
</html>
