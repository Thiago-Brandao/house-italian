# ==========================================
# CONFIGURAÇÕES GERAIS
# ==========================================
quarkus.application.name=house-italian

# ==========================================
# BANCO DE DADOS
# ==========================================
# PostgreSQL principal do projeto em desenvolvimento e produção
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/house-italian
quarkus.datasource.username=postgres
quarkus.datasource.password=123

# Perfil de produção pode usar as mesmas credenciais do PostgreSQL
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/house-italian
%prod.quarkus.datasource.username=postgres
%prod.quarkus.datasource.password=123

# ==========================================
# HIBERNATE ORM
# ==========================================
# PostgreSQL deve preservar dados e aplicar alterações de esquema de forma controlada
%dev.quarkus.hibernate-orm.database.generation=update

# validate = só valida se as tabelas existem (seguro para produção)
%prod.quarkus.hibernate-orm.database.generation=update

# Mostra as queries SQL no console (útil para depurar)
%dev.quarkus.hibernate-orm.log.sql=true

# ==========================================
# JWT - Token de autenticação
# ==========================================
mp.jwt.verify.issuer=house-italian
smallrye.jwt.sign.algorithm=HS256
smallrye.jwt.new-token.signature-key.generate=true

# ==========================================
# SEGURANÇA - Habilita autenticação JWT
# ==========================================
quarkus.http.auth.proactive=false

# ==========================================
# CORS - permite o front-end chamar a API
# ==========================================
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
quarkus.http.cors.headers=accept,authorization,content-type
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS